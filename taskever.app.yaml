name: app

init:
  - dotnet restore AbpTempSimpleApp/AbpTempSimpleApp.csproj
  - dotnet build AbpTempSimpleApp/AbpTempSimpleApp.csproj -v q --nologo
  - run: npm install
    cwd: AbpTempSimpleApp
  - run: abp install-libs
    cwd: AbpTempSimpleApp
  - run: dotnet run --migrate-database --no-launch-profile --no-build
    cwd: AbpTempSimpleApp
    env:
      ConnectionStrings__Default: Data Source=AbpTempSimpleApp.db
      App__SelfUrl: ${preview.url(app)}
      App__UseForwardedHeaders: "true"
      AuthServer__Authority: ${preview.url(app)}
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ASPNETCORE_ENVIRONMENT: Development

services:
  - name: app
    kind: command
    cwd: AbpTempSimpleApp
    command: dotnet run --no-build --no-launch-profile
    port: 8080
    primary: true
    # Only treat the app as ready when /health-status actually returns 200. A cold ABP host
    # (15+ modules, first-run seeding, JIT) can return 503 while warming up and needs well over
    # the default 120s on a constrained sandbox — accepting "any" status or timing out early would
    # mark the preview "Running" before Kestrel truly serves on 8080.
    # timeoutSeconds is the overall readiness window: keep it comfortably above the ~120s+ cold
    # start so the first preview attempt succeeds without a manual "try again".
    healthcheck:
      path: /health-status
      expectStatus: "2xx"
      timeoutSeconds: 300
      intervalMs: 2000
    restartPolicy: on-change
    watchPaths:
      - AbpTempSimpleApp/**/*.cs
      - AbpTempSimpleApp/Pages/**/*
      - AbpTempSimpleApp/wwwroot/**/*
    env:
      ConnectionStrings__Default: Data Source=AbpTempSimpleApp.db
      App__SelfUrl: ${preview.url(app)}
      App__HealthCheckUrl: ${service.internalUrl(app)}/health-status
      App__UseForwardedHeaders: "true"
      AuthServer__Authority: ${preview.url(app)}
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ASPNETCORE_ENVIRONMENT: Development

completion:
  pauseOn: manual
  idleTimeoutMinutes: 30
