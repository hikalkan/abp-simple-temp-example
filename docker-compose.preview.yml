services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskever
      POSTGRES_PASSWORD: taskever
      POSTGRES_DB: AbpTempSimpleApp
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskever -d AbpTempSimpleApp"]
      interval: 2s
      timeout: 3s
      retries: 30
